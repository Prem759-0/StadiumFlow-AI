<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0d1c"/>
      <stop offset="100%" style="stop-color:#12172b"/>
    </linearGradient>
    <linearGradient id="electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e639"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Stadium oval -->
  <ellipse cx="100" cy="100" rx="65" ry="55" fill="none" stroke="url(#electric)" stroke-width="4" opacity="0.8"/>
  <ellipse cx="100" cy="100" rx="45" ry="35" fill="none" stroke="#00e639" stroke-width="2" opacity="0.4"/>
  <!-- Field -->
  <ellipse cx="100" cy="100" rx="28" ry="20" fill="#00e639" opacity="0.15"/>
  <!-- AI nodes -->
  <circle cx="100" cy="45" r="5" fill="#00e639"/>
  <circle cx="165" cy="100" r="5" fill="#06b6d4"/>
  <circle cx="100" cy="155" r="5" fill="#00e639"/>
  <circle cx="35" cy="100" r="5" fill="#06b6d4"/>
  <!-- Connection lines -->
  <line x1="100" y1="45" x2="165" y2="100" stroke="#00e639" stroke-width="1" opacity="0.3"/>
  <line x1="165" y1="100" x2="100" y2="155" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="155" x2="35" y2="100" stroke="#00e639" stroke-width="1" opacity="0.3"/>
  <line x1="35" y1="100" x2="100" y2="45" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  <!-- SF text -->
  <text x="100" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="white">SF</text>
</svg>
